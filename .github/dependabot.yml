version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - "*"

  # The published image is internet-adjacent, so the surfaces a security
  # patch actually lands on — PHP and JS dependencies, and the base image —
  # are watched too. Grouped to keep the PR volume sane.
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      composer:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    # TypeScript 7 is out, but typescript-eslint still peers on `<6.1.0`, so
    # the bump cannot install — and a grouped PR that cannot install blocks
    # every other update in the group with it, then rebases and burns CI on
    # every push to main. Lift this once typescript-eslint supports 7.
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    groups:
      npm:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
